<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Sumbong — Live incident map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
  :root {
    --ink:        #14181d;
    --ink-soft:   #5b6672;
    --paper:      #f2efe9;
    --rule:       #d5cec2;
    --pending:    #c2410c;
    --progress:   #b45309;
    --resolved:   #3f6212;
    --live:       #15803d;
    --outside:    #6d28d9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 20px;
    border-bottom: 1px solid var(--rule);
    background: #fff;
  }
  h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .brgy { color: var(--ink-soft); font-size: 13px; }

  #status {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-soft);
    flex: none;
  }
  .dot.live { background: var(--live); }
  .dot.live::after {
    content: ""; display: block;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--live);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    from { transform: scale(1);   opacity: .7; }
    to   { transform: scale(3.2); opacity: 0;  }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot.live::after { animation: none; }
  }

  #scope {
    width: auto; padding: 6px 11px;
    background: #fff; color: var(--ink);
    border: 1px solid var(--rule);
    font-size: 12.5px; font-weight: 550;
  }
  #scope[aria-pressed="false"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .fog { transition: fill-opacity .45s ease; }
  @media (prefers-reduced-motion: reduce) { .fog { transition: none; } }

  #map { width: 100%; height: 100%; background: #e8e4dc; }

  .pop-outside {
    margin-top: 7px; padding-top: 6px;
    border-top: 1px solid var(--rule);
    font-size: 12px; color: var(--outside);
    font-weight: 600;
  }

  /* Sign-in overlay ----------------------------------------------- */
  #gate {
    position: fixed; inset: 0; z-index: 2000;
    display: grid; place-items: center;
    background: var(--paper);
  }
  #gate .card {
    width: min(340px, 90vw);
    background: #fff;
    border: 1px solid var(--rule);
    padding: 26px;
  }
  #gate h2 { margin: 0 0 4px; font-size: 16px; }
  #gate p  { margin: 0 0 18px; font-size: 13px; color: var(--ink-soft); }
  label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--ink-soft); }
  input {
    width: 100%; padding: 9px 10px; margin-bottom: 12px;
    border: 1px solid var(--rule); background: #fff;
    font: inherit; font-size: 14px; color: var(--ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 1px;
  }
  button {
    width: 100%; padding: 10px;
    border: 0; background: var(--ink); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #err { margin: 12px 0 0; font-size: 13px; color: var(--pending); }
  #err:empty { display: none; }

  /* Popups -------------------------------------------------------- */
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pop-id {
    font: 600 11px/1 ui-monospace, monospace;
    letter-spacing: .04em; color: var(--ink-soft);
  }
  .pop-subject { font-weight: 650; margin: 5px 0 2px; font-size: 14px; }
  .pop-meta { color: var(--ink-soft); font-size: 12px; }
  .pop-desc { margin-top: 7px; }

  .legend {
    background: #fff; padding: 9px 11px;
    border: 1px solid var(--rule);
    font-size: 12px; line-height: 1.9;
  }
  .legend i {
    display: inline-block; width: 9px; height: 9px;
    border-radius: 50%; margin-right: 7px;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>Smart Sumbong</h2>
    <p>Barangay 183 — administrator sign in</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" value="admin@test.local">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go">Sign in</button>
    <p id="err" role="alert"></p>
  </div>
</div>

<header>
  <h1>Live incident map</h1>
  <span class="brgy">Barangay 183, Pasay City</span>
  <button id="scope" type="button" aria-pressed="true">Barangay 183 only</button>
  <span id="status"><span class="dot"></span><span id="statustext">Connecting</span></span>
</header>
<div id="map"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Publishable key. Safe in client code: it carries no privileges of its
// own, every request is still filtered by RLS against the signed-in user.
const SUPABASE_URL = 'https://xmkpokcnjzgxgwysperh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_luTz-T7pfYkDOxtGX3okAQ_HJIWEPVW';

// Centre derived from the OSM boundary relation (id 2988704, PSGC
// 1381100183), not from an approximate pin. The map fits the polygon
// on load rather than trusting a hardcoded zoom.
const BRGY_183 = [14.51646, 121.01621];
const BOUNDARY_URL = 'brgy183.json';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_COLOR = {
  pending_review:        'var(--pending)',
  validated:             'var(--pending)',
  assigned:              'var(--progress)',
  in_progress:           'var(--progress)',
  offline_investigation: 'var(--progress)',
  resolved:              'var(--resolved)',
  closed:                'var(--resolved)',
  archived:              'var(--resolved)',
  rejected:              'var(--ink-soft)',
};

const map = L.map('map', { zoomControl: true }).setView(BRGY_183, 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors',
}).addTo(map);

// ---- boundary ----------------------------------------------------
// OSM returns the relation's ways unordered and in arbitrary direction.
// Join them end to end into closed rings before Leaflet can draw them.
function stitchRings(ways) {
  const segs = ways.map(w => w.map(p => [p.lat, p.lon]));
  const used = new Array(segs.length).fill(false);
  const rings = [];
  const same = (a, b) => Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;

  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    used[i] = true;
    let ring = segs[i].slice();
    let grew = true;
    while (grew) {
      grew = false;
      for (let j = 0; j < segs.length; j++) {
        if (used[j]) continue;
        const s = segs[j], head = ring[0], tail = ring[ring.length - 1];
        if      (same(tail, s[0]))              { ring = ring.concat(s.slice(1)); }
        else if (same(tail, s[s.length - 1]))   { ring = ring.concat(s.slice().reverse().slice(1)); }
        else if (same(head, s[s.length - 1]))   { ring = s.slice(0, -1).concat(ring); }
        else if (same(head, s[0]))              { ring = s.slice().reverse().slice(0, -1).concat(ring); }
        else continue;
        used[j] = true; grew = true;
      }
    }
    if (ring.length > 3) rings.push(ring);
  }
  return rings;
}

// Even-odd ray casting. Used only to label a pin as outside the
// barangay in the popup — the authoritative jurisdiction test is
// ST_Contains in Postgres, not this.
function inRings(lat, lon, rings) {
  let inside = false;
  for (const ring of rings) {
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [yi, xi] = ring[i], [yj, xj] = ring[j];
      if ((yi > lat) !== (yj > lat) &&
          lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
    }
  }
  return inside;
}

let RINGS = [];
let boundaryBounds = null;
let fogLayer = null;
const FOG_OPACITY = 0.58;

async function loadBoundary() {
  try {
    const res = await fetch(BOUNDARY_URL);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const rel = data.elements.find(e => e.type === 'relation');
    const ways = rel.members
      .filter(m => m.type === 'way' && m.geometry)
      .map(m => m.geometry);

    RINGS = stitchRings(ways);
    if (!RINGS.length) return;

    // Outline stays visible in both modes — it is the jurisdiction line,
    // not decoration.
    const outline = L.polygon(RINGS, {
      color: '#14181d', weight: 2, opacity: .9,
      fill: false, interactive: false,
    }).addTo(map);

    // Fog: one polygon covering the world with the barangay rings cut
    // out as holes. Leaflet treats the first ring as the outer boundary
    // and every ring after it as a hole, so the barangay reads as clear
    // glass and everything else is dimmed.
    const WORLD = [[-89.9, -179.9], [-89.9, 179.9], [89.9, 179.9], [89.9, -179.9]];
    fogLayer = L.polygon([WORLD, ...RINGS], {
      className: 'fog',
      stroke: false,
      fillColor: '#0d1117',
      fillOpacity: FOG_OPACITY,
      interactive: false,
    }).addTo(map);

    boundaryBounds = outline.getBounds();
    map.fitBounds(boundaryBounds, { padding: [24, 24] });
    applyScope(true);
  } catch (e) {
    console.warn('Boundary unavailable:', e);
    document.getElementById('scope').disabled = true;
  }
}

// Locked: the admin cannot pan out of the barangay, which is the
// jurisdiction the barangay actually dispatches into. Unlocked: the
// surrounding city is visible, which is where escalated incidents go.
function applyScope(focused) {
  const btn = document.getElementById('scope');
  btn.setAttribute('aria-pressed', String(focused));
  btn.textContent = focused ? 'Barangay 183 only' : 'Showing wider city';

  if (fogLayer) fogLayer.setStyle({ fillOpacity: focused ? FOG_OPACITY : 0 });
  if (!boundaryBounds) return;

  if (focused) {
    // Padded generously: the dimmed surroundings stay on screen, so the
    // admin can see what is adjacent without it competing for attention.
    map.setMaxBounds(boundaryBounds.pad(0.6));
    map.setMinZoom(map.getBoundsZoom(boundaryBounds) - 1);
    map.fitBounds(boundaryBounds, { padding: [24, 24] });
  } else {
    map.setMaxBounds(null);
    map.setMinZoom(10);
  }
}

document.getElementById('scope').addEventListener('click', e => {
  applyScope(e.currentTarget.getAttribute('aria-pressed') !== 'true');
});

const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML =
    '<i style="background:var(--pending)"></i>Awaiting action<br>' +
    '<i style="background:var(--progress)"></i>Being handled<br>' +
    '<i style="background:var(--resolved)"></i>Resolved';
  return d;
};
legend.addTo(map);

const markers = new Map();

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function readableCategory(c) {
  return String(c ?? '').replace(/_/g, ' ');
}

function draw(report) {
  if (report.deleted_at) { remove(report.id); return; }
  if (report.latitude == null || report.longitude == null) return;

  const color = STATUS_COLOR[report.status] ?? 'var(--ink-soft)';
  const filed = report.created_at
    ? new Date(report.created_at).toLocaleString('en-PH', { timeZone: 'Asia/Manila' })
    : '';

  const html =
    `<div class="pop-id">${escapeHtml(report.tracking_id)}</div>` +
    `<div class="pop-subject">${escapeHtml(report.subject)}</div>` +
    `<div class="pop-meta">${escapeHtml(readableCategory(report.category))} · ` +
    `${escapeHtml(String(report.status).replace(/_/g, ' '))}</div>` +
    `<div class="pop-desc">${escapeHtml(report.description)}</div>` +
    (filed ? `<div class="pop-meta" style="margin-top:6px">Filed ${escapeHtml(filed)}</div>` : '') +
    (RINGS.length && !inRings(report.latitude, report.longitude, RINGS)
      ? '<div class="pop-outside">Outside Barangay 183 — refer to city services</div>' : '');

  const existing = markers.get(report.id);
  if (existing) {
    existing.setLatLng([report.latitude, report.longitude]);
    existing.setStyle({ color, fillColor: color });
    existing.setPopupContent(html);
    return;
  }

  const m = L.circleMarker([report.latitude, report.longitude], {
    radius: 8, color, fillColor: color, fillOpacity: .75, weight: 2,
  }).addTo(map).bindPopup(html);
  if (fogLayer) fogLayer.bringToBack();

  markers.set(report.id, m);
}

function remove(id) {
  const m = markers.get(id);
  if (m) { map.removeLayer(m); markers.delete(id); }
}

function setStatus(text, live) {
  document.getElementById('statustext').textContent = text;
  document.querySelector('.dot').classList.toggle('live', !!live);
}

async function start() {
  await loadBoundary();
  // Initial load. RLS decides what comes back — an admin sees every
  // report, and this same page signed in as a resident would see theirs.
  const { data, error } = await supabase
    .from('reports')
    .select('id,tracking_id,subject,description,category,status,latitude,longitude,created_at,deleted_at')
    .is('deleted_at', null)
    .order('created_at', { ascending: false });

  if (error) { setStatus('Could not load reports', false); console.error(error); return; }

  data.forEach(draw);
  setStatus(`${markers.size} on map`, false);

  supabase
    .channel('reports-live')
    .on('postgres_changes',
        { event: '*', schema: 'public', table: 'reports' },
        payload => {
          if (payload.eventType === 'DELETE') remove(payload.old.id);
          else draw(payload.new);
          setStatus(`${markers.size} on map`, true);
        })
    .subscribe(s => {
      if (s === 'SUBSCRIBED') setStatus(`${markers.size} on map`, true);
      if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setStatus('Reconnecting', false);
    });
}

// Sign in ---------------------------------------------------------
const gate = document.getElementById('gate');
const err  = document.getElementById('err');
const btn  = document.getElementById('go');

async function signIn() {
  btn.disabled = true;
  err.textContent = '';
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pw').value,
  });
  if (error) {
    err.textContent = error.message;
    btn.disabled = false;
    return;
  }
  gate.remove();
  start();
}

btn.addEventListener('click', signIn);
document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') signIn();
});

// Skip the gate if a session is already stored.
const { data: { session } } = await supabase.auth.getSession();
if (session) { gate.remove(); start(); }
</script>
</body>
</html>
