<!doctype html>
<meta charset="utf-8">
<title>Landmark bench</title>
<style>html,body{margin:0;background:#101322}canvas{display:block}</style>
<canvas id="c" width="720" height="520"></canvas>
<script src="assets/js/sd-models.js"></script>
<script>
// One landmark on its own, lit with the baked light, from any side, by day or by night. The same shaders and data as the map (sd-models.js),
// no map and no network: ?name=Plaza 66&az=40&pitch=28&night=0&dist=1.0 (az in degrees from the south, dist a multiple of the framing distance).
(async () => {
  const q = new URLSearchParams(location.search);
  await sdModels.ready;
  const { data, bin, lightBin, atlas, emis, atlas2, emis2 } = sdModels.raw();
  const { VS, FS, WASH } = sdModels.shaders();
  const gl = document.getElementById('c').getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  const L = {}; ['u_m', 'u_night', 'u_grow', 'u_atlas', 'u_emis', 'u_atlas2', 'u_emis2', 'u_tiles', 'u_wash'].forEach(n => { L[n] = gl.getUniformLocation(prog, n); });
  ['a_pos', 'a_uv', 'a_mc', 'a_day', 'a_night', 'a_x'].forEach(n => { L[n] = gl.getAttribLocation(prog, n); });
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, bin.subarray(0, data.indexOffsetBytes), gl.STATIC_DRAW);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, bin.subarray(data.indexOffsetBytes), gl.STATIC_DRAW);
  const lb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, lb);
  gl.bufferData(gl.ARRAY_BUFFER, lightBin && lightBin.length === data.vertices * 8 ? lightBin : new Uint8Array(data.vertices * 8).fill(204), gl.STATIC_DRAW);
  const tex = (img) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  const tA = tex(atlas), tE = tex(emis), tA2 = tex(atlas2 || atlas), tE2 = tex(emis2 || emis);
  const tiles = new Float32Array(1024); data.tiles.forEach((r, i) => { if (r) tiles.set(r, i * 4); });

  const name = q.get('name') || 'Plaza 66';
  const md = data.models.find(m => m.name === name) || data.models[+q.get('i') || 0];
  // the model's extent, from its vertices
  const f32 = new Float32Array(bin.buffer, bin.byteOffset + md.voff * 24, md.v * 6);
  let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < md.v; i++) for (let k = 0; k < 3; k++) { const v = f32[i * 6 + k]; mn[k] = Math.min(mn[k], v); mx[k] = Math.max(mx[k], v); }
  const ctr = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, Math.min(mx[2] * .45, 22)];
  const ext = Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]);
  const az = (+q.get('az') || 0) * Math.PI / 180, pitch = (q.get('pitch') === null ? 28 : +q.get('pitch')) * Math.PI / 180;
  const dist = ext * 1.15 * (+q.get('dist') || 1) + 30;
  const night = q.get('night') === '1' ? 1 : 0;
  const W = gl.canvas.width, H = gl.canvas.height;
  // matrices (column major), z up, camera on the south side turned by az
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(...a) || 1; return a.map(x => x / l); }, dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const eye = [ctr[0] + Math.sin(az) * Math.cos(pitch) * dist, ctr[1] - Math.cos(az) * Math.cos(pitch) * dist, ctr[2] + Math.sin(pitch) * dist];
  const f = norm(sub(ctr, eye)), s = norm(cross(f, [0, 0, 1])), u = cross(s, f);
  const view = [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, eye), -dot(u, eye), dot(f, eye), 1];
  const fov = 32 * Math.PI / 180, nr = 2, fr = dist * 6, t = 1 / Math.tan(fov / 2);
  const proj = [t * H / W, 0, 0, 0, 0, t, 0, 0, 0, 0, (fr + nr) / (nr - fr), -1, 0, 0, 2 * fr * nr / (nr - fr), 0];
  const mul = (a, b) => { const o = new Array(16).fill(0); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let v = 0; for (let k = 0; k < 4; k++) v += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = v; } return o; };
  const vp = mul(proj, view);

  gl.viewport(0, 0, W, H);
  gl.clearColor(...(night ? [.055, .07, .13, 1] : [.80, .88, .96, 1])); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  // the ground: a flat plate of the map's own ground colour
  const gp = gl.createProgram(); gl.attachShader(gp, sh(gl.VERTEX_SHADER, '#version 300 es\nuniform mat4 u_m; in vec3 p; void main(){gl_Position=u_m*vec4(p,1.);}')); gl.attachShader(gp, sh(gl.FRAGMENT_SHADER, '#version 300 es\nprecision mediump float; uniform vec3 c; out vec4 o; void main(){o=vec4(c,1.);}')); gl.linkProgram(gp);
  const R = ext * 1.6 + 60, gb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, gb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([ctr[0] - R, ctr[1] - R, -.05, ctr[0] + R, ctr[1] - R, -.05, ctr[0] + R, ctr[1] + R, -.05, ctr[0] - R, ctr[1] - R, -.05, ctr[0] + R, ctr[1] + R, -.05, ctr[0] - R, ctr[1] + R, -.05]), gl.STATIC_DRAW);
  gl.useProgram(gp); gl.uniformMatrix4fv(gl.getUniformLocation(gp, 'u_m'), false, new Float32Array(vp)); gl.uniform3fv(gl.getUniformLocation(gp, 'c'), night ? [.10, .12, .20] : [.93, .91, .86]);
  const pl = gl.getAttribLocation(gp, 'p'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 3, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLES, 0, 6); gl.disableVertexAttribArray(pl);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(L.u_m, false, new Float32Array(vp)); gl.uniform1f(L.u_night, night); gl.uniform1f(L.u_grow, 1); gl.uniform4fv(L.u_tiles, tiles); gl.uniform3fv(L.u_wash, WASH);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tA); gl.uniform1i(L.u_atlas, 0); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tE); gl.uniform1i(L.u_emis, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tA2); gl.uniform1i(L.u_atlas2, 2); gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, tE2); gl.uniform1i(L.u_emis2, 3);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  const base = md.voff * 24;
  gl.enableVertexAttribArray(L.a_pos); gl.vertexAttribPointer(L.a_pos, 3, gl.FLOAT, false, 24, base);
  gl.enableVertexAttribArray(L.a_uv); gl.vertexAttribPointer(L.a_uv, 2, gl.FLOAT, false, 24, base + 12);
  gl.enableVertexAttribArray(L.a_mc); gl.vertexAttribPointer(L.a_mc, 4, gl.UNSIGNED_BYTE, false, 24, base + 20);
  gl.bindBuffer(gl.ARRAY_BUFFER, lb);
  gl.enableVertexAttribArray(L.a_day); gl.vertexAttribPointer(L.a_day, 3, gl.UNSIGNED_BYTE, true, 8, md.voff * 8);
  gl.enableVertexAttribArray(L.a_night); gl.vertexAttribPointer(L.a_night, 3, gl.UNSIGNED_BYTE, true, 8, md.voff * 8 + 3);
  gl.enableVertexAttribArray(L.a_x); gl.vertexAttribPointer(L.a_x, 2, gl.UNSIGNED_BYTE, true, 8, md.voff * 8 + 6);
  gl.drawElements(gl.TRIANGLES, md.i, gl.UNSIGNED_INT, md.ioff * 4);
  window.__ready = { name: md.name, v: md.v, tris: md.i / 3, height: md.height };
})().catch(e => { window.__error = String(e && e.stack || e); });
</script>
