<!doctype html>
<meta charset="utf-8">
<title>GPU bake</title>
<script>
// The GPU bake page (docs/map-data/gpu/bake.mjs opens it in a headless browser on the machine's graphics card).
// A heightfield path tracer in a fragment shader. Every "probe" (a ground pixel, a point on a wall face, a point on a roof) fires
// cosine weighted rays over its hemisphere; a ray that escapes brings back the sky, a ray that hits a wall, a roof or a tree brings
// back that surface's colour lit by the sun (a shadow ray) and by the sky and, for what is near the ground, by the light the
// ground itself received in the first round (a second bounce). The sun is a disc, so shadows have a penumbra.
// Output: for the ground, a ready overlay (tint + darkness); for the other probes, the light they received, and the same under
// an open sky, so the baker can turn the pair into a tone.
const log = s => { window.__status = s; };
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D u_h, u_wall, u_roof, u_prev, u_acc, u_probes;
uniform ivec2 u_hs, u_out;
uniform float u_px;
uniform vec3 u_sun;
uniform int u_mode, u_flat, u_pass, u_rays, u_nprobes, u_bounce;
out vec4 o;
const float PI = 3.14159265;
const vec3 SKY = vec3(.52, .68, 1.0) * .75;
const vec3 SUNE = vec3(1.0, .95, .86) * 1.05;
float H(vec2 q) { if (u_flat == 1) return 0.; ivec2 i = ivec2(floor(q)); if (i.x < 0 || i.y < 0 || i.x >= u_hs.x || i.y >= u_hs.y) return 0.; return texelFetch(u_h, i, 0).r; }
uint seed;
float rnd() { seed = seed * 747796405u + 2891336453u; uint w = ((seed >> ((seed >> 28u) + 4u)) ^ seed) * 277803737u; return float((w >> 22u) ^ w) / 4294967295.; }
float vdc(uint b) { b = (b << 16u) | (b >> 16u); b = ((b & 0x55555555u) << 1u) | ((b & 0xAAAAAAAAu) >> 1u); b = ((b & 0x33333333u) << 2u) | ((b & 0xCCCCCCCCu) >> 2u); b = ((b & 0x0F0F0F0Fu) << 4u) | ((b & 0xF0F0F0F0u) >> 4u); b = ((b & 0x00FF00FFu) << 8u) | ((b & 0xFF00FF00u) >> 8u); return float(b) * 2.3283064365386963e-10; }

// a ray through the height field: true on a hit, with the hit position
bool trace(vec3 o, vec3 d, out vec3 hp) {
  float t = .6, pt = 0.;
  for (int i = 0; i < 96; i++) {
    vec3 p = o + d * t;
    if (p.z > 80. && d.z > 0.) return false;
    if (p.z < H(p.xy / u_px)) {
      float lo = pt, hi = t;
      for (int k = 0; k < 5; k++) { float m = .5 * (lo + hi); vec3 q = o + d * m; if (q.z < H(q.xy / u_px)) hi = m; else lo = m; }
      hp = o + d * hi; return true;
    }
    pt = t; t += max(.75, t * .06);
    if (t > 130.) return false;
  }
  return false;
}
// the fraction of the sun's disc that reaches a point
float sunVis(vec3 o, int n) {
  float v = 0.;
  for (int k = 0; k < n; k++) {
    vec3 d = normalize(u_sun + vec3(rnd() - .5, rnd() - .5, rnd() - .5) * .24);
    float t = .8; bool hit = false;
    for (int i = 0; i < 64; i++) { vec3 p = o + d * t; if (p.z > 80.) break; if (p.z < H(p.xy / u_px)) { hit = true; break; } t += max(.8, t * .08); if (t > 110.) break; }
    v += hit ? 0. : 1.;
  }
  return v / float(n);
}
vec3 prevE(vec2 q) { ivec2 i = ivec2(floor(q)); i = clamp(i, ivec2(0), u_hs - 1); vec4 a = texelFetch(u_prev, i, 0); return a.a > 0. ? a.rgb / a.a : SKY; }
// the light a surface point returns towards the ray that hit it
vec3 shadeHit(vec3 hp) {
  vec2 q = hp.xy / u_px;
  float h0 = H(q);
  vec2 g = vec2(H(q + vec2(1., 0.)) - H(q - vec2(1., 0.)), H(q + vec2(0., 1.)) - H(q - vec2(0., 1.)));
  vec3 n = vec3(0., 0., 1.), alb;
  ivec2 ti = clamp(ivec2(floor(q)), ivec2(0), u_hs - 1);
  if (h0 < .4) { alb = vec3(.5, .49, .47); }
  else if (length(g) > 2.2 && hp.z < h0 - .05) { n = vec3(normalize(-g), 0.); alb = texelFetch(u_wall, ti, 0).rgb * .8; }
  else { alb = texelFetch(u_roof, ti, 0).rgb * .9; }
  vec3 po = hp + n * .5 + vec3(0., 0., .05);
  float cs = max(dot(n, u_sun), 0.);
  float vis = cs > 0. ? sunVis(po, 1) : 0.;
  vec3 amb = SKY * (.5 + .5 * n.z);
  if (u_bounce == 1 && hp.z < 7.) { vec2 fq = q + (n.z > .5 ? vec2(0.) : n.xy * 2.5); amb = mix(amb, prevE(fq), .85); }
  return alb * (SUNE * cs * vis + amb);
}
void probe(vec3 org, vec3 n, out vec3 E) {
  vec3 t = abs(n.z) < .99 ? normalize(cross(n, vec3(0., 0., 1.))) : vec3(1., 0., 0.);
  vec3 b = cross(n, t);
  float r2 = rnd(), r3 = rnd();
  vec3 sum = vec3(0.);
  vec3 o2 = org + n * .15;
  for (int i = 0; i < 256; i++) {
    if (i >= u_rays) break;
    float u1 = (float(i) + r2) / float(u_rays), u2 = fract(vdc(uint(i)) + r3);
    float r = sqrt(u1), ph = 2. * PI * u2;
    vec3 d = t * (r * cos(ph)) + b * (r * sin(ph)) + n * sqrt(max(1. - u1, 0.));
    vec3 hp;
    if (trace(o2, d, hp)) sum += shadeHit(hp); else sum += SKY;
  }
  float cs = max(dot(n, u_sun), 0.);
  E = sum / float(u_rays) + SUNE * cs * (cs > 0. ? sunVis(o2, 4) : 0.);
}
`;
const FS_TRACE = COMMON + `
void main() {
  ivec2 px = ivec2(gl_FragCoord.xy);
  seed = uint(px.x) * 1973u + uint(px.y) * 9277u + uint(u_pass) * 26699u + 1u; rnd(); rnd();
  vec3 org, n;
  if (u_mode == 0) { org = vec3((vec2(px) + .5) * u_px, .06); n = vec3(0., 0., 1.); }
  else {
    int idx = px.y * u_out.x + px.x;
    if (idx >= u_nprobes) { o = texelFetch(u_acc, px, 0); return; }
    int a = 2 * idx, b = a + 1;
    vec4 p0 = texelFetch(u_probes, ivec2(a % 2048, a / 2048), 0), p1 = texelFetch(u_probes, ivec2(b % 2048, b / 2048), 0);
    org = p0.xyz; n = normalize(p1.xyz);
  }
  vec3 E; probe(org, n, E);
  o = texelFetch(u_acc, px, 0) + vec4(E, 1.);
}`;
const FS_NIGHT = COMMON + `
uniform sampler2D u_lamps; uniform int u_nl;
const float LH = 7.5;
vec2 lampLight(vec3 org, vec3 n) {
  vec2 acc = vec2(0.);
  for (int i = 0; i < 4096; i++) {
    if (i >= u_nl) break;
    vec4 L = texelFetch(u_lamps, ivec2(i % 2048, i / 2048), 0);
    vec2 dxy = L.xy - org.xy;
    if (dot(dxy, dxy) > 676.) continue;
    vec3 d = vec3(L.xy, LH) - org;
    float dist = length(d), c = dot(n, d / dist);
    if (c <= 0.) continue;
    bool vis = true;
    for (int s = 1; s <= 20; s++) { vec3 p = org + d * (float(s) / 21.); if (p.z + .2 < H(p.xy / u_px)) { vis = false; break; } }
    if (!vis) continue;
    float e = L.z * c * 1.6 / (1. + (dist / 7.) * (dist / 7.));
    if (L.w > .5) acc.y += e; else acc.x += e;
  }
  return acc;
}
void main() {
  ivec2 px = ivec2(gl_FragCoord.xy);
  vec3 org, n;
  if (u_mode == 0) { org = vec3((vec2(px) + .5) * u_px, .3); n = vec3(0., 0., 1.); }
  else {
    int idx = px.y * u_out.x + px.x;
    if (idx >= u_nprobes) { o = vec4(0.); return; }
    int a = 2 * idx, b = a + 1;
    vec4 p0 = texelFetch(u_probes, ivec2(a % 2048, a / 2048), 0), p1 = texelFetch(u_probes, ivec2(b % 2048, b / 2048), 0);
    org = p0.xyz; n = normalize(p1.xyz);
  }
  o = vec4(lampLight(org, n), 0., 1.);
}`;
const FS_NIGHTG = COMMON + `
uniform float u_k;
void main() { vec4 a = texelFetch(u_acc, ivec2(gl_FragCoord.xy), 0); o = vec4(1. - exp(-u_k * a.x), 1. - exp(-u_k * a.y), 0., 1.); }`;
const FS_GROUND = COMMON + `
uniform vec3 u_E0;
void main() {
  ivec2 px = ivec2(gl_FragCoord.xy);
  vec4 a = texelFetch(u_acc, px, 0);
  vec3 E = a.rgb / max(a.a, 1.);
  vec3 r = clamp(E / u_E0, 0., 1.);
  float m = min(r.r, min(r.g, r.b));
  float al = clamp(1. - m, 0., .86);
  vec3 tint = al > .001 ? vec3(.957, .949, .933) * (r - m) / al : vec3(0.);
  o = vec4(clamp(tint, 0., 1.), al);
}`;

(async () => {
  try {
    const meta = await (await fetch('/in/meta.json')).json();
    const c = document.createElement('canvas'); c.width = 4; c.height = 4; document.body.appendChild(c);
    const gl = c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl || !gl.getExtension('EXT_color_buffer_float')) throw new Error('no float render targets');
    const rinfo = gl.getExtension('WEBGL_debug_renderer_info');
    window.__gpu = rinfo ? gl.getParameter(rinfo.UNMASKED_RENDERER_WEBGL) : '?';
    const W = meta.w, Hh = meta.h;
    const bin = async n => new Uint8Array(await (await fetch('/in/' + n)).arrayBuffer());
    const mk = (w, h, ifmt, fmt, type, data) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
    log('loading inputs');
    const tH = mk(W, Hh, gl.R32F, gl.RED, gl.FLOAT, new Float32Array((await bin('hmap.f32')).buffer));
    const tWall = mk(W, Hh, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, await bin('wall.rgba'));
    const tRoof = mk(W, Hh, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, await bin('roof.rgba'));
    const np = meta.probes;
    let tProbes = null;
    if (np > 0) {
      const raw = new Float32Array((await bin('probes.f32')).buffer), rows = Math.ceil(2 * np / 2048), full = new Float32Array(2048 * rows * 4);
      full.set(raw); tProbes = mk(2048, rows, gl.RGBA32F, gl.RGBA, gl.FLOAT, full);
    }
    const mkProg = (vs, fs) => { const p = gl.createProgram(); [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([t, s]) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); gl.attachShader(p, o); }); gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
    const progT = mkProg(VS, FS_TRACE), progG = mkProg(VS, FS_GROUND), progN = mkProg(VS, FS_NIGHT), progNG = mkProg(VS, FS_NIGHTG);
    const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const target = (w, h, f32) => { const t = f32 ? mk(w, h, gl.RGBA32F, gl.RGBA, gl.FLOAT, null) : mk(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, null); const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; };
    const setU = (p, o) => { gl.useProgram(p); for (const k in o) { const l = gl.getUniformLocation(p, k), v = o[k]; if (l === null) continue; if (typeof v === 'number') (k.startsWith('u_') && Number.isInteger(v) && !['u_px'].includes(k) ? gl.uniform1i : gl.uniform1f).call(gl, l, v); else if (v.length === 2) gl.uniform2i(l, v[0], v[1]); else gl.uniform3f(l, v[0], v[1], v[2]); } };
    const bindTex = (p, name, tex, unit) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(gl.getUniformLocation(p, name), unit); };

    // one full accumulation over a target: `passes` passes of `rays` rays, in strips so no single draw runs long
    async function run(mode, w, h, passes, rays, flat, prev, label) {
      let A = target(w, h, true), B = target(w, h, true);
      for (const x of [A, B]) { gl.bindFramebuffer(gl.FRAMEBUFFER, x.f); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
      const t0 = performance.now(), strip = mode === 0 ? 48 : 96;
      for (let ps = 0; ps < passes; ps++) {
        gl.useProgram(progT);
        bindTex(progT, 'u_h', tH, 0); bindTex(progT, 'u_wall', tWall, 1); bindTex(progT, 'u_roof', tRoof, 2); bindTex(progT, 'u_acc', A.t, 3);
        bindTex(progT, 'u_prev', prev ? prev.t : A.t, 4); if (tProbes) bindTex(progT, 'u_probes', tProbes, 5);
        setU(progT, { u_hs: [W, Hh], u_out: [w, h], u_px: meta.px, u_sun: meta.sun, u_mode: mode, u_flat: flat ? 1 : 0, u_pass: ps, u_rays: rays, u_nprobes: np, u_bounce: prev ? 1 : 0 });
        gl.bindFramebuffer(gl.FRAMEBUFFER, B.f); gl.viewport(0, 0, w, h); gl.enable(gl.SCISSOR_TEST);
        for (let y = 0; y < h; y += strip) { gl.scissor(0, y, w, Math.min(strip, h - y)); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish(); await new Promise(r => setTimeout(r, 0)); }
        gl.disable(gl.SCISSOR_TEST); [A, B] = [B, A];
        log(label + ' pass ' + (ps + 1) + '/' + passes + ' (' + ((performance.now() - t0) / 1000).toFixed(0) + ' s)');
      }
      return A;
    }
    const readF = t => { gl.bindFramebuffer(gl.FRAMEBUFFER, t.f); const a = new Float32Array(t.w * t.h * 4); gl.readPixels(0, 0, t.w, t.h, gl.RGBA, gl.FLOAT, a); return a; };
    const outs = {};
    const stash = (name, bytes) => { outs[name] = bytes; };

    const PASSES = meta.passes, RAYS = meta.rays;
    if (meta.ground) {
      // an open field under the same sky and sun, for what every pixel is compared with
      const flat = await run(0, 4, 4, 1, 4, true, null, 'open field'); const fe = readF(flat); const E0 = [fe[0] / fe[3], fe[1] / fe[3], fe[2] / fe[3]];
      const g1 = await run(0, W, Hh, Math.max(1, Math.floor(PASSES / 2)), RAYS, false, null, 'ground, first bounce');
      const g2 = await run(0, W, Hh, PASSES, RAYS, false, g1, 'ground, second bounce');
      const outT = target(W, Hh, false); gl.bindFramebuffer(gl.FRAMEBUFFER, outT.f); gl.viewport(0, 0, W, Hh);
      gl.useProgram(progG); bindTex(progG, 'u_acc', g2.t, 0); setU(progG, { u_hs: [W, Hh], u_out: [W, Hh], u_E0: E0 }); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
      const px = new Uint8Array(W * Hh * 4); gl.readPixels(0, 0, W, Hh, gl.RGBA, gl.UNSIGNED_BYTE, px); stash('ground.rgba', px);
      window.__ground = g1;   // the first-bounce ground is the second bounce's source for the probes too
      window.__g2 = g2;
    }
    if (np > 0) {
      const pw = 2048, ph = Math.ceil(np / pw);
      const ground = window.__g2 || await run(0, W, Hh, Math.max(1, Math.floor(PASSES / 2)), RAYS, false, null, 'ground for bounce');
      const real = await run(1, pw, ph, PASSES, RAYS, false, ground, 'probes');
      const flat = await run(1, pw, ph, 1, 4, true, null, 'probes, open sky');
      const a = readF(real), b = readF(flat), res = new Float32Array(np * 2);
      const lum = (x, i) => (x[i * 4] * .2126 + x[i * 4 + 1] * .7152 + x[i * 4 + 2] * .0722) / Math.max(x[i * 4 + 3], 1);
      for (let i = 0; i < np; i++) { res[2 * i] = lum(a, i); res[2 * i + 1] = lum(b, i); }
      stash('probes.f32', new Uint8Array(res.buffer));
    }
    if (meta.night) {
      const nl = meta.lamps, lraw = new Float32Array((await bin('lamps.f32')).buffer), lrows = Math.ceil(nl / 2048), lfull = new Float32Array(2048 * lrows * 4);
      lfull.set(lraw); const tLamps = mk(2048, lrows, gl.RGBA32F, gl.RGBA, gl.FLOAT, lfull);
      const nightRun = async (mode, w, h, label) => {
        const T = target(w, h, true); gl.bindFramebuffer(gl.FRAMEBUFFER, T.f); gl.viewport(0, 0, w, h); gl.useProgram(progN);
        bindTex(progN, 'u_h', tH, 0); bindTex(progN, 'u_lamps', tLamps, 1); if (tProbes) bindTex(progN, 'u_probes', tProbes, 5);
        setU(progN, { u_hs: [W, Hh], u_out: [w, h], u_px: meta.px, u_mode: mode, u_flat: 0, u_nprobes: np, u_nl: nl });
        gl.enable(gl.SCISSOR_TEST); const t0 = performance.now(), strip = mode === 0 ? 24 : 128;
        for (let y = 0; y < h; y += strip) { gl.scissor(0, y, w, Math.min(strip, h - y)); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish(); await new Promise(r => setTimeout(r, 0)); log(label + ' ' + Math.min(100, Math.round(100 * (y + strip) / h)) + '% (' + ((performance.now() - t0) / 1000).toFixed(0) + ' s)'); }
        gl.disable(gl.SCISSOR_TEST); return T;
      };
      const NG = await nightRun(0, W, Hh, 'night ground, lamps');
      const outN = target(W, Hh, false); gl.bindFramebuffer(gl.FRAMEBUFFER, outN.f); gl.viewport(0, 0, W, Hh);
      gl.useProgram(progNG); bindTex(progNG, 'u_acc', NG.t, 0); setU(progNG, { u_k: meta.nightK }); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
      const npx = new Uint8Array(W * Hh * 4); gl.readPixels(0, 0, W, Hh, gl.RGBA, gl.UNSIGNED_BYTE, npx); stash('night.rgba', npx);
      if (np > 0) { const pw = 2048, ph = Math.ceil(np / pw), NP = await nightRun(1, pw, ph, 'night, wall faces'); const a = readF(NP), res = new Float32Array(np * 2); for (let i = 0; i < np; i++) { res[2 * i] = a[i * 4]; res[2 * i + 1] = a[i * 4 + 1]; } stash('nprobes.f32', new Uint8Array(res.buffer)); }
    }
    window.__outs = Object.keys(outs).map(n => ({ name: n, bytes: outs[n].length }));
    window.__get = (name, i, size) => { const u = outs[name].subarray(i * size, (i + 1) * size); let s = ''; for (let k = 0; k < u.length; k += 0x8000) s += String.fromCharCode.apply(null, u.subarray(k, k + 0x8000)); return btoa(s); };
    log('done');
  } catch (e) { window.__error = String(e && e.stack || e); log('error'); }
})();
</script>
