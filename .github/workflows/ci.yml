# Checks every push and pull request.
#
#   portal     every PHP file parses, every portal script parses, every
#              English string has a Tagalog one, the portal stays within
#              its size budget, and it starts and answers (login, sign-in
#              redirect, ping, 404, security headers, script nonces).
#   mobile     flutter analyze (no findings allowed) and the tests, for the
#              shared core and the resident app (flows on the real screens,
#              accessibility, translations).
#   app-size   the release APK stays under its size budget.
#   functions  the Edge Functions type-check, lint and pass their tests.
#   database   every migration applied to a throwaway PostgreSQL in the
#              runner, then every rolled-back check in supabase/tests and
#              the query time budget at a busy barangay's volume; and
#              the one-file baseline still matches the migrations. Nothing
#              touches the live project.
#   staging    the same checks against a staging Supabase project, only
#              when STAGING_PROJECT_REF and its two secrets are set.
#
# Actions are pinned to commit hashes (Dependabot keeps them current) and
# every tool to an exact version, so a run means the same thing next month.
#
# Render deploys smartsumbong-ph only after these pass when its Auto-Deploy
# is set to "After CI checks pass".

name: CI

on:
  push:
    branches: [main, D]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: curl, mbstring
      - name: PHP files parse
        run: |
          fail=0
          while IFS= read -r f; do php -l "$f" > /dev/null || fail=1; done < <(git ls-files '*.php')
          exit $fail
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Portal scripts parse
        run: for f in admin/assets/js/*.js; do node --check "$f"; done
      - name: Web manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('admin/manifest.webmanifest','utf8'))"
      - name: Every English string has a Tagalog one
        run: php .github/scripts/i18n-check.php
      - name: Within the performance budget
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: bash .github/scripts/perf-budget.sh
      - name: Portal starts and answers
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: bash .github/scripts/portal-smoke.sh

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Core - analyze and test
        working-directory: mobile/core
        run: flutter pub get && flutter analyze && flutter test
      - name: Resident app - analyze and test
        working-directory: mobile/resident
        run: flutter pub get && flutter analyze && flutter test

  app-size:
    # Performance budget: the Android app a resident downloads. The arm64
    # release APK (what nearly every phone in use installs) must stay under
    # 60 MB; the size of each build is written to the run's summary.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21' # maplibre_gl 0.27 compiles for Java 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build the release APK (arm64)
        working-directory: mobile/resident
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define-from-file=dart_defines.json
      - name: Within 60 MB
        working-directory: mobile/resident
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          bytes=$(stat -c %s "$apk")
          mb=$(awk "BEGIN { printf \"%.1f\", $bytes / 1048576 }")
          echo "Resident app, arm64 release APK: **$mb MB** (budget 60 MB)" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $mb MB"
          [ "$bytes" -le 62914560 ] || { echo "::error::The APK is $mb MB, over the 60 MB budget."; exit 1; }

  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Type-check
        run: deno check supabase/functions/*/index.ts
      - name: Lint
        run: deno lint supabase/functions
      - name: Test
        run: deno test --allow-env supabase/functions

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PostgreSQL 17 (the version Supabase runs) with PostGIS and pg_cron
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-17 postgresql-17-postgis-3 postgresql-17-cron
      - name: Every migration, then every rolled-back check
        env:
          PGVER: '17'
        run: bash supabase/tests/local/run-local.sh
      - name: The baseline still matches the migrations
        env:
          PGVER: '17'
        run: bash supabase/baseline/build.sh --check

  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: database
    # Applies migrations, so only what has been merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One at a time: the checks share throwaway test accounts.
    concurrency:
      group: staging-checks
      cancel-in-progress: false
    env:
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Staging configured?
        id: have
        run: |
          if [ -n "$STAGING_PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
          else
            echo "No staging project configured (variable STAGING_PROJECT_REF, secrets SUPABASE_ACCESS_TOKEN and STAGING_DB_PASSWORD); skipped."
          fi
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.have.outputs.yes
        with:
          version: 2.120.0
      - name: Migrations, then rolled-back checks, on staging
        if: steps.have.outputs.yes
        run: bash .github/scripts/db-checks.sh
