# Keeps the Supabase project from pausing.
#
# The project is on Supabase's free plan, which pauses a project after
# about a week with no API traffic; every app and the admin portal then
# fail until someone restores it in the dashboard. A quiet week (a school
# break, the days before a defense) is exactly when nobody notices.
#
# Once a day this makes one real, harmless database request as an
# anonymous visitor: reading one report id, which the row-level security
# rules answer with an empty list. It needs two repository secrets
# (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       the project URL (as in the apps' dart_defines.json)
#   SUPABASE_ANON_KEY  the public anon key (the same one shipped in the apps)
#
# Scheduled workflows only run from the default branch, so this lives on
# main. "Run workflow" on the Actions tab runs it by hand to test it.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 1 * * *' # daily, 09:17 Philippine time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query the database once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets." >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "$SUPABASE_URL/rest/v1/reports?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Supabase did not answer 200 — check whether the project is paused." >&2
          exit 1
