# Nightly encrypted backup of the database (industry pass 7, 7 Oct 2026).
#
# The Supabase free plan keeps no downloadable backups. Every night this
# dumps the roles, schema and data, encrypts them with a passphrase only
# the team holds, and keeps the result as a workflow artifact for 30 days.
# The repo is public, so nothing unencrypted is ever uploaded.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD  as for CI
#   BACKUP_PASSPHRASE                           a long passphrase, kept in
#                                               the team's password manager
#   HEALTHCHECKS_BACKUP_URL (optional)          a check's ping address on
#                                               healthchecks.io (Healthchecks,
#                                               BSD-3): it is told when the
#                                               backup starts, succeeds or
#                                               fails, and emails the team when
#                                               a night is missed. Unset: no ping.
# Restore: gpg --decrypt smartsumbong-<date>.tgz.gpg | tar xz, then load
# roles.sql, schema.sql and data.sql with psql into a fresh project.

name: Nightly backup

on:
  schedule:
    - cron: '30 18 * * *' # 02:30 Philippine time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      HC_URL: ${{ secrets.HEALTHCHECKS_BACKUP_URL }}
    steps:
      - name: Tell the backup check it has started
        run: if [ -n "$HC_URL" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL/start" || true; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secrets present?
        run: |
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD BACKUP_PASSPHRASE; do
            [ -n "${!s}" ] || { echo "::error::Missing secret $s"; exit 1; }
          done
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - name: Dump and encrypt
        run: |
          supabase link --project-ref vmtzyyyxcmhtqgeeorhg --password "$SUPABASE_DB_PASSWORD" > /dev/null
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p out
          supabase db dump --linked --role-only -f roles.sql
          supabase db dump --linked -f schema.sql
          supabase db dump --linked --data-only --use-copy -f data.sql
          tar czf dump.tgz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "out/smartsumbong-$stamp.tgz.gpg" dump.tgz
          rm -f roles.sql schema.sql data.sql dump.tgz
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartsumbong-backup
          path: out/
          retention-days: 30
      # The restore drill (7 Nov 2026): tonight's backup is decrypted and restored into a throwaway PostgreSQL 17, and every
      # public table must come back with all its rows (tools/restore_drill.sh). A backup that cannot be restored fails the night.
      - name: PostgreSQL 17 with PostGIS and pg_cron, for the restore drill
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-17 postgresql-17-postgis-3 postgresql-17-cron
      - name: Restore drill
        run: bash tools/restore_drill.sh "$(ls out/smartsumbong-*.tgz.gpg | head -1)"
      # 11 Nov 2026: what a signed-out and a signed-in caller may do in the live database is what is on file (supabase/grants.txt,
      # the same file CI holds the migrations to). A restore, a new project or a dashboard click that leaves grants wider than
      # the migrations intend fails the night. Object names and rights only.
      - name: The live grants are the ones on file
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" bash supabase/tools/grants.sh check             -h aws-0-ap-southeast-1.pooler.supabase.com -p 5432 -U postgres.vmtzyyyxcmhtqgeeorhg -d postgres
      - name: Tell the backup check how it went
        if: always()
        run: |
          [ -n "$HC_URL" ] || exit 0
          if [ "${{ job.status }}" = success ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL" || true
          else curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL/fail" || true; fi
