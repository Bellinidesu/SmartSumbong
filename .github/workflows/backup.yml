# Nightly encrypted backup of the database (industry pass 7, 7 Oct 2026).
#
# The Supabase free plan keeps no downloadable backups. Every night this
# dumps the roles, schema and data, encrypts them with a passphrase only
# the team holds, and keeps the result as a workflow artifact for 30 days.
# The repo is public, so nothing unencrypted is ever uploaded.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD  as for CI
#   BACKUP_PASSPHRASE                           a long passphrase, kept in
#                                               the team's password manager
# Restore: gpg --decrypt smartsumbong-<date>.tgz.gpg | tar xz, then load
# roles.sql, schema.sql and data.sql with psql into a fresh project.

name: Nightly backup

on:
  schedule:
    - cron: '30 18 * * *' # 02:30 Philippine time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secrets present?
        run: |
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD BACKUP_PASSPHRASE; do
            [ -n "${!s}" ] || { echo "::error::Missing secret $s"; exit 1; }
          done
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Dump and encrypt
        run: |
          supabase link --project-ref xmkpokcnjzgxgwysperh --password "$SUPABASE_DB_PASSWORD" > /dev/null
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p out
          supabase db dump --linked --role-only -f roles.sql
          supabase db dump --linked -f schema.sql
          supabase db dump --linked --data-only --use-copy -f data.sql
          tar czf dump.tgz roles.sql schema.sql data.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "out/smartsumbong-$stamp.tgz.gpg" dump.tgz
          rm -f roles.sql schema.sql data.sql dump.tgz
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartsumbong-backup
          path: out/
          retention-days: 30
