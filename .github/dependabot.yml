# Weekly pull requests for outdated dependencies: the Flutter packages,
# the GitHub Actions the workflows use (pinned to commit hashes, which
# Dependabot updates along with the version comment) and the portal's
# Docker base image.
version: 2
updates:
  - package-ecosystem: pub
    directory: /mobile/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /mobile/resident
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
