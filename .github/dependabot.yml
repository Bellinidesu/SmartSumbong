# Pull requests for outdated dependencies: the Flutter packages, the SMART lab's Python tools (monthly),
# the GitHub Actions the workflows use (pinned to commit hashes, which
# Dependabot updates along with the version comment) and the portal's
# Docker base image.
version: 2
updates:
  - package-ecosystem: pub
    directory: /mobile/core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /mobile/resident
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: composer
    directory: /admin
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /tools/smart_lab
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
    # Python: patches only (3.12.x); a new minor is a planned upgrade
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # PHP: patches only (8.5.x security releases). A minor or major PHP, or a release candidate
    # (Dependabot offered 8.6.0RC2 on 22 Oct 2026), is a planned upgrade, not a weekly bump.
    ignore:
      - dependency-name: php
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
