# Secret scanning (security.yml). Uses gitleaks' default rules, minus the
# keys that are public by design and ship inside every copy of the app:
#   - the Firebase Android/iOS API keys (google-services.json,
#     firebase_options.dart): identifiers, not secrets. Restrict them in
#     Google Cloud Console -> Credentials to the app's package name and
#     signing certificate, which is what actually protects them.
#   - the Supabase publishable key (sb_publishable_..., in
#     dart_defines.json and once in admin/map.html): meant for clients;
#     row-level security is what protects the data. Matched by its prefix,
#     so a secret key (sb_secret_...) or service-role JWT is still caught.
# The same files from the former separate tanod app (mobile/tanod, removed)
# are in the history too.
# Anything else gitleaks finds is a real leak: rotate it, then remove it.
[extend]
useDefault = true

[allowlist]
description = "Client keys that are public by design"
paths = [
  '''mobile/(resident|tanod)/android/app/google-services\.json''',
  '''mobile/(resident|tanod)/lib/firebase_options\.dart''',
  '''mobile/(resident|tanod)/dart_defines\.json''',
]
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+''',
]
