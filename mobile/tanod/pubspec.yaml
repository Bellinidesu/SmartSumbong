name: tanod
description: "SmartSumbong — Barangay Tanod app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  # Maps: MapLibre with OpenFreeMap vector tiles (lib/widgets/brgy_map.dart).
  maplibre_gl: ^0.27.1
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

  # supabase_flutter is not listed here for the same reason it is not
  # listed in the resident app: it arrives through smartsumbong_core,
  # and pub puts every transitive package in package_config.json, so the
  # imports resolve. The analyzer will raise
  # depend_on_referenced_packages; that is a lint, not an error, and the
  # two apps are consistent with each other.
  smartsumbong_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/foreground.png"
  adaptive_icon_background: "#FF9800"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  
flutter:
  assets:
    - assets/images/
    - assets/map/
  # Urbanist stands in for Visby CF, the typeface the Figma file is set
  # in: Visby is a paid font, Urbanist is SIL OFL (assets/fonts/
  # Urbanist-OFL.txt) and the closest free match in both letter shapes
  # and line width. Static instances cut from the variable font, because
  # FontWeight does not reliably drive a variable font's weight axis.
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Urbanist-Black.ttf
          weight: 900
  uses-material-design: true
