name: smartsumbong_core
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  # Only to switch on Android's system photo picker (Android 9-12 get it
  # from Google Play services); versions follow image_picker's.
  image_picker_android: any
  image_picker_platform_interface: any
  uuid: ^4.6.0
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.2
  # 13.x (permission_handler_android 14) compiles against Android API 37,
  # like flutter_secure_storage 11; see the app's compileSdk.
  permission_handler: ^13.0.2

  # Push notifications (FCM) + the local-notification display FCM itself
  # does not do while the app is in the foreground.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Crash visibility — rides on the same Firebase project as the above.
  firebase_crashlytics: ^5.4.0

  # Video playback for report/dispatch evidence, and image caching so a
  # reopened report does not re-download every photo from Cloudinary.
  video_player: ^2.14.1
  chewie: ^1.17.2
  cached_network_image: ^4.0.4

  # Session tokens in the OS keystore instead of plain SharedPreferences.
  # 11.x compiles against Android API 37; the app sets compileSdk 37 for it
  # (android/app/build.gradle.kts).
  flutter_secure_storage: ^11.2.0

  # Distinguishing "no signal" from a real server error.
  connectivity_plus: ^7.3.1

  # App version shown in Settings, useful now that builds are distributed
  # as a manually-shared APK rather than through a store with its own
  # version tracking.
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

  # Face ID / fingerprint unlock (biometric_auth.dart, biometric_lock_
  # gate.dart), shared by both apps -- reads whatever biometric the
  # resident or tanod already enrolled in their phone's own OS, purely
  # local, nothing sent anywhere.
  local_auth: ^3.0.2

  # The above two files' opt-in flag lives here rather than in
  # secure_session_storage.dart's Keystore-backed storage -- it is a
  # per-handset UI preference, not a credential, so it follows the same
  # plain-SharedPreferences pattern as each app's own "remember me" and
  # onboarding-seen flags rather than needing the Keystore's guarantees.
  shared_preferences: ^2.5.6

  # On-device OCR triage for ID photos at registration (id_ocr.dart,
  # migration 0039) -- reads what an ID photo says, entirely on the
  # phone, no network call, nothing about the photo leaves the device.
  # Not identity verification (see id_ocr.dart's header); the admin
  # still decides everything, this only orders/labels their queue.
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



